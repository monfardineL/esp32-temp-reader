openapi: 3.0.0
info:
  title: Masterbuilt 710 Smoker Monitor API
  description: >
    Telemetry sent via MQTT by the ESP32 microcontroller to the RabbitMQ broker.
    Includes Epoch timestamp generated via internal NTP sync.
  version: 1.1.0

components:
  schemas:
    ProbeData:
      type: object
      description: Individual temperature probe reading.
      properties:
        id:
          type: integer
          description: Unique identifier for the probe (1 to 4).
          example: 1
        t:
          type: number
          format: float
          nullable: true
          description: >
            Temperature in degrees Celsius. Returns null if the probe is disconnected.
          example: 22.5
      required:
        - id
        - t

    SmokerPayload:
      type: object
      description: The main telemetry packet sent every 30 seconds.
      properties:
        device:
          type: string
          description: Unique hardware identifier for the ESP32 unit.
          example: "smoker-01"
        ts:
          type: integer
          description: Epoch timestamp (UTC) representing exactly when the read occurred.
          example: 1710345600
        data:
          type: array
          description: Array containing the status of all 4 available probes.
          items:
            $ref: '#/components/schemas/ProbeData'
          minItems: 4
          maxItems: 4
      required:
        - device
        - ts
        - data

paths:
  /mqtt/smoker/temps:
    post:
      summary: Publish Telemetry
      description: Representation of the payload published to the 'smoker/temps' topic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmokerPayload'
      responses:
        '200':
          description: Valid payload accepted by the broker.
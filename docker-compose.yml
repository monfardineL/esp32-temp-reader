version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_URL=postgres://smoker:smokerpass@timescaledb:5432/smoker?sslmode=disable
      - PORT=8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_USER=smoker
      - POSTGRES_PASSWORD=smokerpass
      - POSTGRES_DB=smoker
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoker -d smoker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data: